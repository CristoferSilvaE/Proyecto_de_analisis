<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel ATS | Canvia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Panel Reclutador TI</a>
    </div>
</nav>

<div class="container bg-white p-4 rounded shadow-sm">
    
    <div th:if="${param.exito}" class="alert alert-success">
        Evaluación ATS automatizada completada. Revisa los resultados.
    </div>
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Postulaciones Recibidas</h3>
        <a href="#" class="btn btn-outline-secondary">Volver a Vacantes</a>
    </div>

    <table class="table table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Candidato</th>
                <th>Correo</th>
                <th>Fecha Postulación</th>
                <th>Estado Actual</th>
                <th>Acción / Evaluación</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="postulacion : ${postulaciones}">
                <td th:text="${postulacion.candidato.nombres} + ' ' + ${postulacion.candidato.apellidos}">Nombre</td>
                <td th:text="${postulacion.candidato.correo}">Correo</td>
                <td th:text="${#temporals.format(postulacion.fechaPostulacion, 'dd-MM-yyyy HH:mm')}">Fecha</td>
                <td>
                    <span class="badge" 
                          th:classappend="${postulacion.estado.nombre == 'RECIBIDA'} ? 'bg-secondary' : 
                                        (${postulacion.estado.nombre == 'PRESELECCIONADO'} ? 'bg-success' : 'bg-danger')"
                          th:text="${postulacion.estado.nombre}">
                        Estado
                    </span>
                </td>
                <td>
                    <!-- Si la postulación está recién recibida, mostramos el botón de ejecutar ATS -->
                    <form th:if="${postulacion.estado.nombre == 'RECIBIDA'}" 
                          th:action="@{/reclutador/evaluar/{id}(id=${postulacion.idPostulacion})}" 
                          method="post" class="d-inline">
                        <!-- Simulamos ID Reclutador en sesión -->
                        <input type="hidden" name="idReclutador" value="2" />
                        <button type="submit" class="btn btn-sm btn-primary">Ejecutar ATS (Leer CV)</button>
                    </form>

                    <!-- Si ya fue evaluado, el botón se bloquea o desaparece -->
                    <button th:unless="${postulacion.estado.nombre == 'RECIBIDA'}" 
                            class="btn btn-sm btn-outline-success" disabled>
                        Evaluado
                    </button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(postulaciones)}">
                <td colspan="5" class="text-center text-muted">Aún no hay postulaciones para esta vacante.</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
